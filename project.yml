name: Caleb
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: app.caleb.offlinechat
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  Caleb:
    type: application
    platform: iOS
    sources:
      - path: Caleb
        excludes: [CalebEngine.h]
    dependencies:
      - framework: Vendor/llama.xcframework
        embed: true
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Caleb
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Caleb/CalebEngine.h
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
schemes:
  Caleb:
    build:
      targets:
        Caleb: all
    run:
      config: Debug
